<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#18102B"><link rel="manifest" href="/manifest.json"><link rel="icon" href="/icon.svg">
<title>GoSwift</title>
<style>
:root{--violet:#834DFB;--turbo:#F0E100;--haiti:#18102B;--chalk:#F5F3FF;--mute:#6b6780;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;margin:0}html,body{height:100%;background:var(--haiti);color:var(--chalk);overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}button{border:0;background:none;cursor:pointer}
main{height:100dvh;overflow-y:auto;padding-bottom:calc(90px + env(safe-area-inset-bottom))}
.view{display:none}.view.on{display:block}
#feed{scroll-snap-type:y mandatory;height:100dvh;overflow-y:auto;padding:0}
.ad{height:100dvh;scroll-snap-align:start;position:relative;display:flex;flex-direction:column;justify-content:flex-end;padding:20px 16px 110px;background:linear-gradient(160deg,var(--violet),var(--haiti) 70%)}
.ad video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ad .shade{position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(24,16,43,.92))}
.ad>*:not(video):not(.shade){position:relative}
.timer{position:absolute!important;top:calc(14px + env(safe-area-inset-top));left:16px;background:var(--haiti);color:var(--turbo);padding:6px 12px;border-radius:99px;font-weight:700;font-size:13px}
.tag{position:absolute!important;top:calc(14px + env(safe-area-inset-top));right:16px;background:var(--turbo);color:var(--haiti);padding:6px 12px;border-radius:99px;font-weight:800;font-size:12px}
.ad h2{font-size:30px;line-height:1.1;font-weight:800;margin:6px 0}
.price{font-size:26px;font-weight:800;color:var(--turbo)}.shop{opacity:.85;font-size:14px}
.row{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;padding:14px;border-radius:16px;font-weight:700;text-align:center}
.btn.p{background:var(--turbo);color:var(--haiti)}.btn.s{background:rgba(245,243,255,.16);backdrop-filter:blur(6px)}
.pad{padding:24px 16px}h1{font-size:28px;margin-bottom:14px}
.card{background:var(--chalk);color:var(--haiti);border-radius:20px;padding:16px;margin-bottom:12px}
.card small,.muted{color:var(--mute)}
input,select,textarea{width:100%;padding:13px;border-radius:14px;border:2px solid transparent;background:var(--chalk);color:var(--haiti);margin-bottom:10px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--violet)}
.steps{display:flex;gap:4px;margin:10px 0}.steps i{flex:1;height:6px;border-radius:9px;background:#ddd7f5}.steps i.d{background:var(--violet)}
.sheet{position:fixed;inset:0;background:rgba(24,16,43,.8);display:none;align-items:flex-end;z-index:20}.sheet.on{display:flex}
.sheet>div{background:var(--haiti);width:100%;border-radius:28px 28px 0 0;padding:22px 16px calc(22px + env(safe-area-inset-bottom));max-height:88dvh;overflow:auto;border-top:3px solid var(--violet)}
.msg{max-width:78%;padding:9px 13px;border-radius:16px;margin:6px 0;background:var(--chalk);color:var(--haiti)}.msg.me{margin-left:auto;background:var(--violet);color:#fff}
/* floating notch nav (matches reference) */
nav{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));height:64px;background:var(--chalk);border-radius:22px;display:flex;z-index:10;box-shadow:0 8px 24px rgba(0,0,0,.4)}
nav button{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;padding-bottom:8px;font-size:11px;color:var(--mute)}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s}
nav .ic{display:grid;place-items:center;transition:all .25s}
nav button.on{color:var(--haiti);font-weight:700}
nav button.on .ic{position:absolute;top:-24px;width:56px;height:56px;border-radius:50%;background:var(--chalk);border:7px solid var(--haiti);color:var(--violet)}
nav button.on svg{fill:rgba(131,77,251,.3)}
@media(min-width:700px){body{max-width:480px;margin:auto}nav{max-width:460px;margin:auto}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<main id="main">
 <section class="view on" id="v-feed"><div id="feed"></div></section>
 <section class="view pad" id="v-orders"><h1>Orders</h1><div id="orders"></div></section>
 <section class="view pad" id="v-post"><h1>Post a flash ad</h1><div id="post"></div></section>
 <section class="view pad" id="v-chats"><h1>Chats</h1><div id="chats"></div></section>
 <section class="view pad" id="v-me"><h1>Profile</h1><div id="me"></div></section>
</main>
<div class="sheet" id="sheet"><div id="sheetBody"></div></div>
<nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s),e=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ugx=n=>'UGX '+Number(n).toLocaleString('en-UG');
let U=JSON.parse(localStorage.gsUser||'null'),CFG={},ME=null,cur='feed';
const api=(p,o={})=>fetch('/api'+p,{...o,headers:{...(o.body&&!(o.body instanceof FormData)?{'Content-Type':'application/json'}:{}),'X-User-Id':U?.id||'',...o.headers},body:o.body&&!(o.body instanceof FormData)?JSON.stringify(o.body):o.body}).then(async r=>{const j=r.status==204?{}:await r.json();if(!r.ok)throw new Error(j.error||'Something went wrong');return j});
const toast=m=>alert(m);
const TABS=[['feed','Feed','<path d="M3 11l9-8 9 8v10H3z"/><path d="M10 21v-6h4v6"/>'],['orders','Orders','<path d="M4 8h14l-3-3M20 16H6l3 3"/>'],['post','Post','<path d="M12 5v14M5 12h14"/>'],['chats','Chats','<path d="M4 5h16v11H9l-5 4z"/>'],['me','Profile','<circle cx="12" cy="9" r="4"/><path d="M4 21c1-5 15-5 16 0"/>']];
function nav(){$('#nav').innerHTML=TABS.map(([k,l,i])=>`<button class="${k==cur?'on':''}" data-k="${k}"><span class="ic"><svg viewBox="0 0 24 24">${i}</svg></span>${l}</button>`).join('')}
$('#nav').onclick=ev=>{const b=ev.target.closest('button');b&&go(b.dataset.k)};
function go(k){cur=k;document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id=='v-'+k));nav();$('#main').style.overflow=k=='feed'?'hidden':'auto';({feed:feed,orders:orders,post:post,chats:chats,me:me})[k]()}
const left=t=>{const s=t-Date.now()/1000;if(s<=0)return null;const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h>=24?Math.floor(h/24)+'d '+h%24+'h left':h?h+'h '+m+'m left':m+'m left'};
let io;
async function feed(){const ads=await api('/ads');const f=$('#feed');
 f.innerHTML=ads.length?ads.map(a=>`<article class="ad" data-id="${a.id}" data-exp="${a.expires_at}">
 ${a.video_url?`<video muted loop playsinline preload="none" data-src="${e(a.video_url)}"></video>`:''}<div class="shade"></div>
 <span class="timer"></span>${a.sponsored?'<span class="tag">Sponsored deal</span>':a.pinned?'<span class="tag">Pinned</span>':''}
 <div class="shop">${e(a.shop_name)} · ${e(a.area)}</div><h2>${e(a.title)}</h2><p>${e(a.description)}</p><div class="price">${ugx(a.price_ugx)}</div>
 <div class="row"><button class="btn s" onclick="chat(${a.id})">Chat</button><button class="btn p" onclick="orderSheet(${a.id},'${e(a.title).replace(/'/g,'')}',${a.price_ugx})">Order now</button></div></article>`).join(''):'<div class="pad"><h1>No live ads right now</h1><p class="muted">New flash ads appear here as merchants post them.</p></div>';
 io?.disconnect();io=new IntersectionObserver(es=>es.forEach(x=>{const v=x.target.querySelector('video');if(!v)return;if(x.isIntersecting){if(!v.src)v.src=v.dataset.src;v.play().catch(()=>{});api('/ads/'+x.target.dataset.id+'/view',{method:'POST'}).catch(()=>{})}else v.pause()}),{threshold:.7});
 f.querySelectorAll('.ad').forEach(a=>io.observe(a));tick()}
function tick(){document.querySelectorAll('.ad').forEach(a=>{const l=left(+a.dataset.exp);l?a.querySelector('.timer').textContent='Ends in '+l.replace(' left',''):a.remove()})}
setInterval(tick,30000);
const needUser=()=>{if(U)return false;sheet(`<h1>Join GoSwift</h1><input id="rn" placeholder="Your name"><input id="rp" type="tel" placeholder="Phone, e.g. 0700 000 000"><select id="rr"><option value="consumer">I want to buy</option><option value="merchant">I want to sell</option></select><input id="rs" placeholder="Shop name (sellers only)"><button class="btn p" style="width:100%" onclick="join()">Continue</button>`);return true};
async function join(){try{U=await api('/register',{method:'POST',body:{name:$('#rn').value,phone:$('#rp').value,role:$('#rr').value,shop_name:$('#rs').value}});localStorage.gsUser=JSON.stringify(U);sheet();go(cur)}catch(x){toast(x.message)}}
function sheet(h){$('#sheetBody').innerHTML=h||'';$('#sheet').classList.toggle('on',!!h)}
$('#sheet').onclick=ev=>{if(ev.target.id=='sheet')sheet()};
function orderSheet(id,t,p){if(needUser())return;const f=p*CFG.service_fee_pct/100,d=CFG.delivery_fee_ugx;
 sheet(`<h1>${e(t)}</h1><input id="oq" type="number" min="1" value="1"><input id="oa" placeholder="Delivery address or landmark">
 <p class="muted" id="sum"></p><button class="btn p" style="width:100%;margin-top:10px" onclick="placeOrder(${id})">Place order</button>`);
 const up=()=>$('#sum').textContent=`Items ${ugx(p*$('#oq').value)} + service fee ${CFG.service_fee_pct}% + delivery ${ugx(d)} = ${ugx(p*$('#oq').value*(1+CFG.service_fee_pct/100)+d)}`;$('#oq').oninput=up;up()}
async function placeOrder(id){try{await api('/orders',{method:'POST',body:{ad_id:id,qty:+$('#oq').value,address:$('#oa').value}});sheet();go('orders')}catch(x){toast(x.message)}}
async function chat(adId){if(needUser())return;try{const c=await api('/chats',{method:'POST',body:{ad_id:adId}});openChat(c.id,'Chat')}catch(x){toast(x.message)}}
let poll,last=0;
async function openChat(id,t){last=0;sheet(`<h1>${e(t)}</h1><div id="msgs" style="min-height:200px"></div><div class="row"><input id="mb" placeholder="Type a message" style="margin:0"><button class="btn p" style="flex:0 0 80px" onclick="send(${id})">Send</button></div>`);
 clearInterval(poll);const load=async()=>{const m=await api(`/chats/${id}/messages?after=${last}`);m.forEach(x=>{last=x.id;$('#msgs')?.insertAdjacentHTML('beforeend',`<div class="msg ${x.sender_id==U.id?'me':''}">${e(x.body)}</div>`)})};await load();poll=setInterval(()=>$('#msgs')?load():clearInterval(poll),4000)}
async function send(id){const b=$('#mb');if(!b.value)return;await api(`/chats/${id}/messages`,{method:'POST',body:{body:b.value}});b.value=''}
async function chats(){if(needUser())return;const c=await api('/chats');$('#chats').innerHTML=c.length?c.map(x=>`<div class="card" onclick="openChat(${x.id},'${e(x.ad_title).replace(/'/g,'')}')"><b>${e(x.ad_title)}</b><br><small>${e(x.last||'No messages yet')}</small></div>`).join(''):'<p class="muted">Tap Chat on any ad to ask a seller a question.</p>'}
const LBL={placed:'Placed',confirmed:'Confirmed',preparing:'Preparing',out_for_delivery:'On the way',delivered:'Delivered',cancelled:'Cancelled'},FLOW=['placed','confirmed','preparing','out_for_delivery','delivered'];
async function orders(){if(needUser())return;const o=await api('/orders');$('#orders').innerHTML=o.length?o.map(x=>{const i=FLOW.indexOf(x.status),n=FLOW[i+1];return`<div class="card"><b>${e(x.ad_title)}</b> × ${x.qty}<br><small>${ugx(x.total_ugx)} · ${LBL[x.status]}</small>
 <div class="steps">${FLOW.map((s,k)=>`<i class="${k<=i?'d':''}"></i>`).join('')}</div>
 ${x.is_seller&&n?`<button class="btn p" style="width:100%;background:var(--violet);color:#fff" onclick="setStatus(${x.id},'${n}')">Mark ${LBL[n]}</button>`:''}</div>`}).join(''):'<p class="muted">Orders you place or receive show up here with live status.</p>'}
async function setStatus(id,s){await api(`/orders/${id}/status`,{method:'POST',body:{status:s}});orders()}
function post(){if(needUser())return;if(U.role!='merchant'){$('#post').innerHTML='<p class="muted">Switch to a seller account in Profile to post ads.</p>';return}
 $('#post').innerHTML=`<input id="pt" placeholder="What are you selling?"><textarea id="pd" rows="2" placeholder="Short details"></textarea><input id="pp" type="number" placeholder="Price in UGX"><select id="ph">${CFG.durations.map(h=>`<option value="${h}">${h==72?'3 days':h+' hours'}</option>`)}</select><input id="pv" type="file" accept="video/*"><button class="btn p" style="width:100%" onclick="publish()">Publish ad</button>
 <p class="muted" style="margin-top:12px">Extend or pin a live ad from Profile.</p>`}
async function publish(){const f=new FormData();f.append('title',$('#pt').value);f.append('description',$('#pd').value);f.append('price_ugx',$('#pp').value);f.append('duration_hours',$('#ph').value);if($('#pv').files[0])f.append('video',$('#pv').files[0]);
 try{await api('/ads',{method:'POST',body:f});go('feed')}catch(x){toast(x.message)}}
async function me(){if(needUser())return;const r=await api('/me');ME=r.merchant;
 $('#me').innerHTML=`<div class="card"><b>${e(r.user.name)}</b><br><small>${e(r.user.role)}${ME?' · '+ME.plan+' plan':''}</small></div>
 ${ME?`<div class="card"><b>Seller plans</b><br><small>Free: 3 live ads · Pro ${ugx(CFG.plans.pro.price)}/mo: 20 ads + analytics · Business ${ugx(CFG.plans.business.price)}/mo: inventory</small>
 <div class="row"><button class="btn s" style="background:var(--violet);color:#fff" onclick="plan('pro')">Go Pro</button><button class="btn s" style="background:var(--haiti);color:#fff" onclick="plan('business')">Business</button></div></div>`:''}
 <button class="btn s" onclick="localStorage.clear();location.reload()">Log out</button>`}
async function plan(p){try{await api('/plan',{method:'POST',body:{plan:p}});me()}catch(x){toast(x.message)}}
if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js');
api('/config').then(c=>{CFG=c;go('feed')}).catch(()=>go('feed'));
</script></body></html>
